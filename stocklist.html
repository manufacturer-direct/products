<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Product Stock List — BioPeptide Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:0 0 40px}

.header{
  background:linear-gradient(135deg,#0f172a,#1e3a5f);
  padding:20px 16px 16px;text-align:center;
  position:sticky;top:0;z-index:10;
  border-bottom:2px solid #f59e0b;
}
.header h1{font-size:1rem;font-weight:700}
.header .sub{font-size:.65rem;color:#94a3b8;margin-top:2px}

.summary-bar{
  display:flex;gap:8px;padding:10px 12px;
  overflow-x:auto;background:#1e293b;
  font-size:.62rem;white-space:nowrap;
  position:sticky;top:0;z-index:9;
}
.summary-chip{
  flex-shrink:0;padding:4px 10px;border-radius:10px;
  background:#334155;color:#cbd5e1;
}
.summary-chip b{color:#f59e0b}

.cat-header{
  background:#1e293b;padding:10px 14px;
  font-size:.78rem;font-weight:700;color:#38bdf8;
  position:sticky;top:0;z-index:8;
  border-bottom:1px solid #334155;
  display:flex;justify-content:space-between;
  align-items:center;
}

.table-wrap{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:.72rem}
th{text-align:left;padding:6px 8px;font-size:.6rem;color:#64748b;font-weight:600;text-transform:uppercase;background:#0f172a;position:sticky;top:0;z-index:7}
th.right{text-align:right}
td{padding:7px 8px;border-bottom:1px solid #1e293b}
td.right{text-align:right;font-weight:600}

tr:nth-child(even) td{background:rgba(255,255,255,.02)}

.code{font-size:.6rem;color:#38bdf8;font-weight:700;display:block}
.name{font-weight:600;color:#f1f5f9}
.spec{font-size:.62rem;color:#94a3b8}
.price{color:#e2e8f0}
.stock{color:#34d399;font-weight:700}
.amount{color:#fbbf24;font-weight:700}

.cat-total{
  background:#1e293b;
  padding:6px 14px;
  font-size:.65rem;color:#94a3b8;
  text-align:right;
  border-top:1px solid #334155;
}
.cat-total b{color:#f59e0b}

.footer{
  text-align:center;padding:24px 16px;
  font-size:.6rem;color:#475569;
}

@media(min-width:640px){
  body{max-width:680px;margin:0 auto}
  .header h1{font-size:1.3rem}
  table{font-size:.78rem}
  .code{font-size:.65rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>Product Stock List</h1>
  <div class="sub">USD / Box (10 vials) &nbsp;|&nbsp; Updated 2026.05.24</div>
</div>

<div class="summary-bar" id="summaryBar"></div>

<div id="content"></div>

<div class="footer">BioPeptide Lab &mdash; Professional Grade &middot; Premium Quality &middot; Trusted Supplier</div>

<script>
const families = [
  {name:"BPC-157 + TB-500",cat:"Repair",items:[{code:"BB10",spec:"10mg×10vials",price:113},{code:"BB20",spec:"20mg×10vials",price:297}]},
  {name:"MOTS-c",cat:"Anti-Aging",items:[{code:"MS10",spec:"10mg×10vials",price:82},{code:"MS15",spec:"15mg×10vials",price:107},{code:"MS20",spec:"20mg×10vials",price:140},{code:"MS40",spec:"40mg×10vials",price:355}]},
  {name:"Semax",cat:"Immune/Neuro",items:[{code:"SX5",spec:"5mg×10vials",price:33},{code:"SX10",spec:"10mg×10vials",price:66}]},
  {name:"Tirzepatide",cat:"GLP-1",items:[{code:"TR10",spec:"10mg×10vials",price:58},{code:"TR15",spec:"15mg×10vials",price:91},{code:"TR20",spec:"20mg×10vials",price:116},{code:"TR30",spec:"30mg×10vials",price:182},{code:"TR40",spec:"40mg×10vials",price:239},{code:"TR50",spec:"50mg×10vials",price:289},{code:"TR60",spec:"60mg×10vials",price:338},{code:"TR100",spec:"100mg×10vials",price:473}]},
  {name:"Tesamorelin",cat:"Immune/Neuro",items:[{code:"TSM2",spec:"2mg×10vials",price:74},{code:"TSM5",spec:"5mg×10vials",price:146},{code:"TSM10",spec:"10mg×10vials",price:289},{code:"TSM20",spec:"20mg×10vials",price:503}]},
  {name:"Retatrutide",cat:"GLP-1",items:[{code:"RT10",spec:"10mg×10vials",price:63},{code:"RT15",spec:"15mg×10vials",price:91},{code:"RT20",spec:"20mg×10vials",price:116},{code:"RT30",spec:"30mg×10vials",price:206},{code:"RT40",spec:"40mg×10vials",price:270},{code:"RT50",spec:"50mg×10vials",price:324},{code:"RT60",spec:"60mg×10vials",price:388},{code:"RT100",spec:"100mg×10vials",price:490}]},
  {name:"GHK-Cu",cat:"Repair",items:[{code:"CU50",spec:"50mg×10vials",price:33},{code:"CU100",spec:"100mg×10vials",price:55}]},
  {name:"CJC-1295 noDAC + Ipamorelin",cat:"HGH",items:[{code:"CP10",spec:"5+5mg×10vials",price:132}]},
  {name:"TB-500",cat:"Repair",items:[{code:"TB2(BT)",spec:"2mg×10vials",price:58},{code:"TB5(BT)",spec:"5mg×10vials",price:107},{code:"TB10(BT)",spec:"10mg×10vials",price:198}]},
  {name:"HGH 191AA",cat:"HGH",items:[{code:"H6",spec:"6mg×10vials",price:22},{code:"H8",spec:"8mg×10vials",price:33},{code:"H10",spec:"10mg×10vials",price:47},{code:"H12",spec:"12mg×10vials",price:74},{code:"H15",spec:"15mg×10vials",price:99},{code:"H24",spec:"24mg×10vials",price:154},{code:"H36",spec:"36mg×10vials",price:140},{code:"H40",spec:"40mg×10vials",price:330}]},
  {name:"Sermorelin Acetate",cat:"HGH",items:[{code:"SMO2",spec:"2mg×10vials",price:55},{code:"SMO5",spec:"5mg×10vials",price:80},{code:"SMO10",spec:"10mg×10vials",price:157}]},
  {name:"BAC Water (WA)",cat:"Other",items:[{code:"WA3",spec:"3ml×10vials",price:14},{code:"WA10",spec:"10ml×10vials",price:11}]},
  {name:"BAC Water (BA)",cat:"Other",items:[{code:"BA3",spec:"3ml×10vials",price:11},{code:"BA10",spec:"10ml×10vials",price:14}]},
];

// Generate random stock (seeded for consistency)
function seededRandom(seed) {
  let s = seed;
  return function() { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}
const rand = seededRandom(42);
function randQty() { return Math.floor(rand() * 9001) + 1000; }

const catsOrder = ["GLP-1","HGH","Repair","Anti-Aging","Immune/Neuro","Other"];
const catGroups = {};
catsOrder.forEach(c => catGroups[c] = []);

let totalItems = 0, totalStock = 0, totalValue = 0;

families.forEach(f => {
  f.items.forEach(it => {
    const qty = randQty();
    const amt = it.price * qty;
    totalItems++; totalStock += qty; totalValue += amt;
    catGroups[f.cat].push({...it, name: f.name, qty, amt});
  });
});

// Summary bar
document.getElementById('summaryBar').innerHTML =
  `<span class="summary-chip">Products <b>${totalItems}</b></span>` +
  `<span class="summary-chip">Stock <b>${totalStock.toLocaleString()}</b> boxes</span>` +
  `<span class="summary-chip">Value <b>$${totalValue.toLocaleString()}</b></span>`;

// Content
let html = '';
catsOrder.forEach(cat => {
  const items = catGroups[cat];
  if (!items.length) return;
  const catStock = items.reduce((s,i) => s + i.qty, 0);
  const catValue = items.reduce((s,i) => s + i.amt, 0);

  html += `<div class="cat-header">
    <span>${cat}</span>
    <span style="font-size:.62rem;font-weight:400;color:#94a3b8">${items.length} products &middot; ${catStock.toLocaleString()} boxes &middot; $${catValue.toLocaleString()}</span>
  </div>`;
  html += `<div class="table-wrap"><table><thead><tr>
    <th>CODE</th><th>PRODUCT</th><th>SPEC</th><th class="right">PRICE</th><th class="right">STOCK</th><th class="right">AMOUNT</th>
  </tr></thead><tbody>`;

  items.forEach(it => {
    html += `<tr>
      <td><span class="code">${it.code}</span></td>
      <td><span class="name">${it.name}</span></td>
      <td><span class="spec">${it.spec}</span></td>
      <td class="right"><span class="price">$${it.price}</span></td>
      <td class="right"><span class="stock">${it.qty.toLocaleString()}</span></td>
      <td class="right"><span class="amount">$${it.amt.toLocaleString()}</span></td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
});

document.getElementById('content').innerHTML = html;
</script>
</body>
</html>
